name: Update README

on:
  schedule:
    - cron: "0 0 */3 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    name: Update projects and blog from sahilfruitwala.com
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update README from RSS
        run: python .github/update_readme_from_rss.py

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update projects and blog from sahilfruitwala.com"
          file_pattern: README.md
